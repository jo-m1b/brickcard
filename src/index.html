<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brickcard - Imprimez de bien jolies cartes pour vos briques LEGO®</title>
  <meta name="theme-color" content="#141414" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Brickcard" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="img/brickcard-favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="icon" href="img/brickcard-favicon-96x96.png" type="image/png" sizes="96x96" />
  <link rel="icon" href="img/brickcard-favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="img/brickcard-apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="css/styles.css?v=0.8.4" />
  <script type="importmap">
  {
    "imports": {
      "./js/app.js": "./js/app.js?v=0.8.4",
      "./js/version.js": "./js/version.js?v=0.8.4"
    }
  }
  </script>
  <script>
    /* Après styles.css (script bloquant) : pas de flush layout avant CSS, pas de flash thème */
    (function () {
      try {
        var t = localStorage.getItem("brickcard:ui-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar no-print">
      <a href="#page/about" class="topbar-brand" id="brand-link">
        <img class="brand-logo" src="img/brickcard-logo.svg" width="40" height="55" alt="" />
        <span class="brand-text">
          <span class="brand-name">Brickcard</span>
          <span class="brand-version" id="app-version"></span>
        </span>
      </a>

      <div class="topbar-search" id="topbar-search" hidden>
        <div class="search-bar">
          <!-- ri-search-line (optionnelle ; défaut pour la recherche) -->
          <span class="form-control-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"/>
            </svg>
          </span>
          <input
            class="form-control"
            type="search"
            id="global-search"
            placeholder="Rechercher une carte…"
            autocomplete="off"
            aria-label="Rechercher (référence, titre, thème, année)"
          />
          <div class="search-bar-trail">
            <span class="search-count" id="search-count" aria-live="polite"></span>
            <div class="search-sort">
              <button
                type="button"
                class="btn ghost sm icon-only search-sort-btn"
                id="search-sort-btn"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="search-sort-menu"
              >
                <!-- ri-filter-3-fill -->
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                  <path d="M10 18h4v-2h-4zM3 6v2h18V6zm3 7h12v-2H6z"/>
                </svg>
                <span class="visually-hidden">Trier les cartes</span>
              </button>
            </div>
          </div>
          <div class="search-sort-menu form-select-list" id="search-sort-menu" role="listbox" hidden>
            <div class="form-select-option" role="option" id="search-sort-opt-updatedAt" data-sort="updatedAt" aria-selected="false">
              <span class="form-select-option-label">Date de modification</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-legoSetRef" data-sort="legoSetRef" aria-selected="false">
              <span class="form-select-option-label">Référence</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-title" data-sort="title" aria-selected="false">
              <span class="form-select-option-label">Titre</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-releaseYear" data-sort="releaseYear" aria-selected="false">
              <span class="form-select-option-label">Année de sortie</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-pieceCount" data-sort="pieceCount" aria-selected="false">
              <span class="form-select-option-label">Nombre de pièces</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-figurineCount" data-sort="figurineCount" aria-selected="false">
              <span class="form-select-option-label">Nombre de figurines</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
          </div>
        </div>
      </div>

      <div class="topbar-actions" id="topbar-actions">
        <button type="button" class="btn primary is-hidden" id="btn-new-card">
          <!-- ri-add-fill -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/>
          </svg>
          <span>Nouvelle carte</span>
        </button>

        <div class="print-menu" id="print-menu" hidden>
          <button
            type="button"
            class="btn ghost icon-only print-menu-btn is-empty"
            id="btn-print-menu"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="print-menu-panel"
          >
            <!-- ri-printer-fill -->
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 17h10v5H7zm12 3v-5H5v5H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1zM5 10v2h3v-2zm2-8h10a1 1 0 0 1 1 1v3H6V3a1 1 0 0 1 1-1"/>
            </svg>
            <span class="visually-hidden">Impression</span>
            <span class="btn-badge" id="print-menu-count" hidden aria-hidden="true">0</span>
          </button>
          <div class="print-menu-panel" id="print-menu-panel" role="dialog" aria-labelledby="print-menu-title" aria-describedby="print-menu-desc">
            <p class="print-menu-title" id="print-menu-title">Aucune carte à imprimer !</p>
            <p class="print-menu-desc" id="print-menu-desc">Sélectionnez au moins une carte à imprimer parmi celles de votre collection.</p>
            <button type="button" class="btn secondary sm" id="btn-print-select-all" hidden>
              <!-- ri-add-fill -->
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/>
              </svg>
              <span id="print-select-all-label">Ajouter les cartes</span>
            </button>
            <button type="button" class="btn secondary sm" id="btn-print-select-none" hidden>
              <!-- ri-subtract-fill -->
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 11H5v2h14z"/>
              </svg>
              <span>Vider l’impression</span>
            </button>
            <button type="button" class="btn primary sm" id="btn-print-run" disabled>
              <!-- ri-printer-fill -->
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 17h10v5H7zm12 3v-5H5v5H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1zM5 10v2h3v-2zm2-8h10a1 1 0 0 1 1 1v3H6V3a1 1 0 0 1 1-1"/>
              </svg>
              <span>Lancer l’impression</span>
            </button>
          </div>
        </div>

        <button type="button" class="btn ghost icon-only" id="btn-settings">
          <!-- ri-tools-fill -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.33 3.272a3.5 3.5 0 0 1 4.472 4.473L20.647 18.59l-2.122 2.122L7.68 9.867a3.5 3.5 0 0 1-4.472-4.474L5.444 7.63a1.5 1.5 0 0 0 2.121-2.121zm10.367 1.883l3.182-1.768l1.414 1.415l-1.768 3.182l-1.768.353l-2.12 2.121l-1.415-1.414l2.121-2.121zm-7.071 7.778l2.121 2.122l-4.95 4.95A1.5 1.5 0 0 1 3.58 17.99l.097-.107z"/>
          </svg>
          <span class="visually-hidden">Paramètres</span>
        </button>
      </div>
    </header>

    <main id="main" class="main" aria-busy="true">
      <!-- Page de chargement : copie de loadingViewMarkup() (JS pas encore chargé). Galerie : #developer/loading -->
      <section class="empty-view no-print">
        <div class="empty-view-body">
          <div class="brick" aria-hidden="true">
            <span class="brick-error-icon">
              <!-- ri-error-warning-line -->
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"/></svg>
            </span>
          </div>
          <h1 class="view-title">Chargement<span class="visually-hidden">...</span><span class="loading-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
          <p class="empty-view-error" id="boot-error" role="alert" hidden></p>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-root" class="modal-root no-print"></div>

  <div id="toast-root" class="toast-root no-print"></div>

  <div id="print-root" class="print-root" aria-hidden="true"></div>

  <script>
    /* Hors module : un import cassé n’atteint jamais boot() */
    (function () {
      function showBootError(err) {
        var main = document.getElementById("main");
        var el = document.getElementById("boot-error");
        if (!main || !el || !main.hasAttribute("aria-busy")) return;
        var msg = err && err.message ? err.message : String(err || "Erreur inconnue");
        el.hidden = false;
        el.textContent = msg;
        main.removeAttribute("aria-busy");
      }
      window.showBootError = showBootError;
      window.addEventListener("error", function (e) {
        showBootError(e.error || e.message || e);
      });
      window.addEventListener("unhandledrejection", function (e) {
        showBootError(e.reason);
      });
    })();
  </script>
  <script type="module">
    import("./js/app.js").catch(function (err) {
      if (typeof showBootError === "function") showBootError(err);
    });
  </script>
</body>
</html>
