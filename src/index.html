<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brickcard - Print lovely cards for your LEGO® bricks</title>
  <meta name="description" content="Create and print poker-size cards for your LEGO® sets. Add a photo, theme, and details, then laminate them for box-less sets." />
  <link rel="canonical" href="https://brickcard.org/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Brickcard" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:url" content="https://brickcard.org/" />
  <meta property="og:title" content="Brickcard - Print lovely cards for your LEGO® bricks" />
  <meta property="og:description" content="Create and print poker-size cards for your LEGO® sets. Add a photo, theme, and details, then laminate them for box-less sets." />
  <meta property="og:image" content="https://brickcard.org/img/brickcard-og-1200x630.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Brickcard — poker-size cards for LEGO® sets" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Brickcard - Print lovely cards for your LEGO® bricks" />
  <meta name="twitter:description" content="Create and print poker-size cards for your LEGO® sets. Add a photo, theme, and details, then laminate them for box-less sets." />
  <meta name="twitter:image" content="https://brickcard.org/img/brickcard-og-1200x630.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Brickcard",
    "url": "https://brickcard.org/",
    "description": "Create and print poker-size cards for your LEGO® sets. Add a photo, theme, and details, then laminate them for box-less sets.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "inLanguage": "en"
  }
  </script>
  <meta name="theme-color" content="#141414" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Brickcard" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="img/brickcard-favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="icon" href="img/brickcard-favicon-96x96.png" type="image/png" sizes="96x96" />
  <link rel="icon" href="img/brickcard-favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="img/brickcard-apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="css/styles.css?v=0.9.1" />
  <script type="importmap">
  {
    "imports": {
      "./js/app.js": "./js/app.js?v=0.9.1",
      "./js/version.js": "./js/version.js?v=0.9.1"
    }
  }
  </script>
  <script>
    /* After styles.css (blocking script): no layout flush before CSS, no theme flash */
    (function () {
      try {
        var t = localStorage.getItem("brickcard:ui-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
      try {
        var loc = localStorage.getItem("brickcard:ui-locale");
        if (loc === "en" || loc === "fr") {
          document.documentElement.lang = loc;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <noscript>
    <section class="empty-view no-print">
      <div class="empty-view-body">
        <h1 class="view-title">Brickcard</h1>
        <p>Create and print poker-size cards for your LEGO® sets. Add a photo, theme, and details, then laminate them for box-less sets.</p>
        <p><a class="link" href="#page/about">About Brickcard</a></p>
      </div>
    </section>
  </noscript>
  <div id="app" class="app">
    <header class="topbar no-print">
      <a href="#page/about" class="topbar-brand" id="brand-link">
        <img class="brand-logo" src="img/brickcard-logo.svg" width="40" height="55" alt="" />
        <span class="brand-text">
          <span class="brand-name">Brickcard</span>
          <span class="brand-version" id="app-version"></span>
        </span>
      </a>

      <div class="topbar-search" id="topbar-search" hidden>
        <div class="search-bar">
          <!-- ri-search-line (optional; default for search) -->
          <span class="form-control-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"/>
            </svg>
          </span>
          <input
            class="form-control"
            type="search"
            id="global-search"
            placeholder="Search for a card…"
            autocomplete="off"
            aria-label="Search (reference, title, theme, year)"
          />
          <div class="search-bar-trail">
            <span class="search-count" id="search-count" aria-live="polite"></span>
            <div class="search-sort">
              <button
                type="button"
                class="btn ghost sm icon-only search-sort-btn"
                id="search-sort-btn"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="search-sort-menu"
              >
                <!-- ri-filter-3-fill -->
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                  <path d="M10 18h4v-2h-4zM3 6v2h18V6zm3 7h12v-2H6z"/>
                </svg>
                <span class="visually-hidden">Sort cards</span>
              </button>
            </div>
          </div>
          <div class="search-sort-menu form-select-list" id="search-sort-menu" role="listbox" hidden>
            <div class="form-select-option" role="option" id="search-sort-opt-updatedAt" data-sort="updatedAt" aria-selected="false">
              <span class="form-select-option-label">Date modified</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-legoSetRef" data-sort="legoSetRef" aria-selected="false">
              <span class="form-select-option-label">Reference</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-title" data-sort="title" aria-selected="false">
              <span class="form-select-option-label">Title</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-releaseYear" data-sort="releaseYear" aria-selected="false">
              <span class="form-select-option-label">Release year</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-pieceCount" data-sort="pieceCount" aria-selected="false">
              <span class="form-select-option-label">Number of pieces</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
            <div class="form-select-option" role="option" id="search-sort-opt-figurineCount" data-sort="figurineCount" aria-selected="false">
              <span class="form-select-option-label">Number of figurines</span>
              <span class="form-select-icon form-select-icon--right" hidden></span>
            </div>
          </div>
        </div>
      </div>

      <div class="topbar-actions" id="topbar-actions" data-nosnippet>
        <button type="button" class="btn primary is-hidden" id="btn-new-card">
          <!-- ri-add-fill -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/>
          </svg>
          <span>New card</span>
        </button>

        <div class="print-menu" id="print-menu" hidden data-nosnippet>
          <button
            type="button"
            class="btn ghost icon-only print-menu-btn is-empty"
            id="btn-print-menu"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="print-menu-panel"
          >
            <!-- ri-printer-fill -->
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 17h10v5H7zm12 3v-5H5v5H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1zM5 10v2h3v-2zm2-8h10a1 1 0 0 1 1 1v3H6V3a1 1 0 0 1 1-1"/>
            </svg>
            <span class="visually-hidden">Print</span>
            <span class="btn-badge" id="print-menu-count" hidden aria-hidden="true">0</span>
          </button>
          <div class="print-menu-panel" id="print-menu-panel" role="dialog" aria-labelledby="print-menu-title" aria-describedby="print-menu-desc">
            <p class="print-menu-title" id="print-menu-title">No cards to print!</p>
            <p class="print-menu-desc" id="print-menu-desc">Select at least one card to print from your collection.</p>
            <button type="button" class="btn secondary sm" id="btn-print-select-all" hidden>
              <!-- ri-add-fill -->
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/>
              </svg>
              <span id="print-select-all-label">Add the cards</span>
            </button>
            <button type="button" class="btn secondary sm" id="btn-print-select-none" hidden>
              <!-- ri-subtract-fill -->
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 11H5v2h14z"/>
              </svg>
              <span>Clear print selection</span>
            </button>
            <button type="button" class="btn primary sm" id="btn-print-run" disabled>
              <!-- ri-printer-fill -->
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 17h10v5H7zm12 3v-5H5v5H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1zM5 10v2h3v-2zm2-8h10a1 1 0 0 1 1 1v3H6V3a1 1 0 0 1 1-1"/>
              </svg>
              <span>Start printing</span>
            </button>
          </div>
        </div>

        <button type="button" class="btn ghost icon-only" id="btn-settings">
          <!-- ri-tools-fill -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.33 3.272a3.5 3.5 0 0 1 4.472 4.473L20.647 18.59l-2.122 2.122L7.68 9.867a3.5 3.5 0 0 1-4.472-4.474L5.444 7.63a1.5 1.5 0 0 0 2.121-2.121zm10.367 1.883l3.182-1.768l1.414 1.415l-1.768 3.182l-1.768.353l-2.12 2.121l-1.415-1.414l2.121-2.121zm-7.071 7.778l2.121 2.122l-4.95 4.95A1.5 1.5 0 0 1 3.58 17.99l.097-.107z"/>
          </svg>
          <span class="visually-hidden">Settings</span>
        </button>
      </div>
    </header>

    <main id="main" class="main" aria-busy="true">
      <!-- Loading page: copy of loadingViewMarkup() (JS not loaded yet). Gallery: #developer/loading -->
      <section class="empty-view no-print">
        <div class="empty-view-body">
          <div class="brick" aria-hidden="true">
            <span class="brick-error-icon">
              <!-- ri-error-warning-line -->
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z"/></svg>
            </span>
          </div>
          <h1 class="view-title">Loading<span class="visually-hidden">...</span><span class="loading-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
          <p class="empty-view-error" id="boot-error" role="alert" hidden></p>
          <button type="button" class="btn primary is-hidden" id="boot-retry" hidden>
            <!-- ri-refresh-fill -->
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M5.46257 4.43262C7.21556 2.91688 9.5007 2 12 2C17.5228 2 22 6.47715 22 12C22 14.1361 21.3302 16.1158 20.1862 17.7406L17 12H20C20 7.58172 16.4183 4 12 4C9.84982 4 7.89777 4.84827 6.46023 6.22842L5.46257 4.43262ZM18.5374 19.5674C16.7844 21.0831 14.4993 22 12 22C6.47715 22 2 17.5228 2 12C2 9.86386 2.66979 7.88416 3.81382 6.25944L7 12H4C4 16.4183 7.58172 20 12 20C14.1502 20 16.1022 19.1517 17.5398 17.7716L18.5374 19.5674Z"/></svg>
            <span>Retry</span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-root" class="modal-root no-print"></div>

  <div id="toast-root" class="toast-root no-print"></div>

  <div id="print-root" class="print-root" aria-hidden="true"></div>

  <script>
    /* Outside the module: a broken import never reaches boot() */
    (function () {
      function bustingReload() {
        location.replace(location.pathname + "?r=" + Date.now() + (location.hash || ""));
      }
      function showBootError(err) {
        var main = document.getElementById("main");
        var el = document.getElementById("boot-error");
        if (!main || !el || !main.hasAttribute("aria-busy")) return;
        var msg = err && err.message ? err.message : String(err || "Unknown error");
        el.hidden = false;
        el.textContent = msg;
        var retry = document.getElementById("boot-retry");
        if (retry) {
          retry.hidden = false;
          retry.classList.remove("is-hidden");
        }
        main.removeAttribute("aria-busy");
      }
      window.showBootError = showBootError;
      var retryBtn = document.getElementById("boot-retry");
      if (retryBtn) retryBtn.addEventListener("click", bustingReload);
      window.addEventListener("error", function (e) {
        showBootError(e.error || e.message || e);
      });
      window.addEventListener("unhandledrejection", function (e) {
        showBootError(e.reason);
      });
    })();
  </script>
  <script type="module">
    import("./js/app.js").catch(function (err) {
      if (typeof showBootError === "function") showBootError(err);
    });
  </script>
</body>
</html>
