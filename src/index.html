<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brickcard Generator</title>
  <script>
    /* Applique le thème avant le CSS pour éviter un flash */
    (function () {
      try {
        var t = localStorage.getItem("brickcard-generator:ui-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar no-print">
      <a href="#/about" class="topbar-brand" id="brand-link">
        <img class="brand-logo" src="img/logo-brickcard-generator.svg" width="40" height="55" alt="" />
        <span class="brand-text">
          <span class="brand-name">Brickcard Generator</span>
          <span class="brand-version" id="app-version"></span>
        </span>
      </a>

      <div class="topbar-search" id="topbar-search" hidden>
        <div class="topbar-search-field">
          <input
            type="search"
            id="global-search"
            placeholder="Rechercher une carte…"
            autocomplete="off"
            aria-label="Rechercher (référence, titre, thème, année)"
          />
          <div class="topbar-search-trail">
            <span class="search-count" id="search-count" aria-live="polite"></span>
            <div class="search-sort">
              <button
                type="button"
                class="btn ghost sm icon-only search-sort-btn"
                id="search-sort-btn"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="search-sort-menu"
              >
                <!-- ri-filter-3-fill -->
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                  <path d="M10 18h4v-2h-4zM3 6v2h18V6zm3 7h12v-2H6z"/>
                </svg>
                <span class="visually-hidden">Trier les cartes</span>
              </button>
              <div class="search-sort-menu" id="search-sort-menu" role="menu" hidden>
                <div class="search-sort-row">
                  <button type="button" class="search-sort-option" role="menuitemradio" data-sort="updatedAt" aria-checked="false">Date de modification</button>
                  <button type="button" class="search-sort-dir" data-sort-dir="updatedAt" aria-label="Inverser le tri" hidden></button>
                </div>
                <div class="search-sort-row">
                  <button type="button" class="search-sort-option" role="menuitemradio" data-sort="legoSetRef" aria-checked="false">Référence</button>
                  <button type="button" class="search-sort-dir" data-sort-dir="legoSetRef" aria-label="Inverser le tri" hidden></button>
                </div>
                <div class="search-sort-row">
                  <button type="button" class="search-sort-option" role="menuitemradio" data-sort="title" aria-checked="false">Titre</button>
                  <button type="button" class="search-sort-dir" data-sort-dir="title" aria-label="Inverser le tri" hidden></button>
                </div>
                <div class="search-sort-row">
                  <button type="button" class="search-sort-option" role="menuitemradio" data-sort="releaseYear" aria-checked="false">Année de sortie</button>
                  <button type="button" class="search-sort-dir" data-sort-dir="releaseYear" aria-label="Inverser le tri" hidden></button>
                </div>
                <div class="search-sort-row">
                  <button type="button" class="search-sort-option" role="menuitemradio" data-sort="pieceCount" aria-checked="false">Nombre de pièces</button>
                  <button type="button" class="search-sort-dir" data-sort-dir="pieceCount" aria-label="Inverser le tri" hidden></button>
                </div>
                <div class="search-sort-row">
                  <button type="button" class="search-sort-option" role="menuitemradio" data-sort="figurineCount" aria-checked="false">Nombre de figurines</button>
                  <button type="button" class="search-sort-dir" data-sort-dir="figurineCount" aria-label="Inverser le tri" hidden></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="topbar-actions" id="topbar-actions">
        <button type="button" class="btn primary" id="btn-new-card">
          <!-- ri-add-fill -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/>
          </svg>
          <span>Nouvelle carte</span>
        </button>

        <div class="print-menu" id="print-menu" hidden>
          <button
            type="button"
            class="btn ghost icon-only print-menu-btn is-empty"
            id="btn-print-menu"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="print-menu-panel"
          >
            <!-- ri-printer-fill -->
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 17h10v5H7zm12 3v-5H5v5H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1zM5 10v2h3v-2zm2-8h10a1 1 0 0 1 1 1v3H6V3a1 1 0 0 1 1-1"/>
            </svg>
            <span class="visually-hidden">Impression</span>
            <span class="btn-badge" id="print-menu-count" hidden aria-hidden="true">0</span>
          </button>
          <div class="print-menu-panel" id="print-menu-panel" role="dialog" aria-label="Impression">
            <p class="print-menu-summary" id="print-menu-summary">Aucune carte à imprimer</p>
            <button type="button" class="btn secondary sm" id="btn-print-select-all">
              <!-- ri-add-fill -->
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/>
              </svg>
              <span>Tout sélectionner</span>
            </button>
            <button type="button" class="btn secondary sm" id="btn-print-select-none" hidden>
              <!-- ri-subtract-fill -->
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 11H5v2h14z"/>
              </svg>
              <span>Tout désélectionner</span>
            </button>
            <button type="button" class="btn primary sm" id="btn-print-run" disabled>
              <!-- ri-printer-fill -->
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 17h10v5H7zm12 3v-5H5v5H3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1zM5 10v2h3v-2zm2-8h10a1 1 0 0 1 1 1v3H6V3a1 1 0 0 1 1-1"/>
              </svg>
              <span>Imprimer la sélection</span>
            </button>
          </div>
        </div>

        <button type="button" class="btn ghost icon-only" id="btn-settings">
          <!-- ri-tools-fill -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.33 3.272a3.5 3.5 0 0 1 4.472 4.473L20.647 18.59l-2.122 2.122L7.68 9.867a3.5 3.5 0 0 1-4.472-4.474L5.444 7.63a1.5 1.5 0 0 0 2.121-2.121zm10.367 1.883l3.182-1.768l1.414 1.415l-1.768 3.182l-1.768.353l-2.12 2.121l-1.415-1.414l2.121-2.121zm-7.071 7.778l2.121 2.122l-4.95 4.95A1.5 1.5 0 0 1 3.58 17.99l.097-.107z"/>
          </svg>
          <span class="visually-hidden">Paramètres</span>
          <span class="tooltip" aria-hidden="true">
            <strong class="tooltip-title">Paramètres</strong>
            <span class="tooltip-desc">Options et configuration de l’application.</span>
          </span>
        </button>
      </div>
    </header>

    <main id="main" class="main"></main>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden />

  <div id="modal-root" class="modal-root no-print"></div>

  <div id="print-root" class="print-root" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
