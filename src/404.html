<!DOCTYPE html>
<html lang="en">
<head>

  <base href="/" />
  <meta name="theme-color" content="#141414" />

  <link rel="stylesheet" href="css/styles.css?v=0.9.3" />
  <script>
    /* After styles.css (blocking script): no layout flush before CSS, no theme flash */
    (function () {
      try {
        var t = localStorage.getItem("brickcard:ui-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
</head>

  <div id="app" class="app">
    <main id="main" class="main">
      <!-- Load error — retry (gallery: #developer/loading); title = app name -->
      <section class="empty-view no-print">
        <div class="empty-view-body">
          <div class="brick" aria-hidden="true">
            <span class="brick-error-icon">

            </span>
          </div>
          <h1 class="view-title">Brickcard</h1>
