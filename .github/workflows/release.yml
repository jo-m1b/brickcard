# GitHub Release (notes + zip/tar.gz natifs) à chaque tag vX.Y.Z

name: Release Brickcard

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --force --tags
          NOTES="$(mktemp)"

          PREV=""
          while IFS= read -r t; do
            if [ -n "$t" ] && [ "$t" != "$TAG" ]; then
              PREV="$t"
              break
            fi
          done < <(git tag -l 'v*.*.*' --sort=-version:refname)

          append_section() {
            local title="$1"
            local body="$2"
            if [ -n "$body" ]; then
              printf '## %s\n\n%s\n\n' "$title" "$body" >> "$NOTES"
            fi
          }

          # Same subject once, first-seen order; repeats get a count (daily catalog refresh).
          collapse_dupes() {
            awk 'NF {
              if (!($0 in seen)) order[++n] = $0
              seen[$0]++
            }
            END {
              for (i = 1; i <= n; i++) {
                line = order[i]
                c = seen[line]
                if (c > 1) printf "%s (%d×)\n", line, c
                else print line
              }
            }'
          }

          if [ -n "$PREV" ]; then
            feats=""
            fixes=""
            docs=""
            chores=""
            other=""
            # Pull merges of the daily catalog refresh (and any other merge) are noise.
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              # Optional leading gitmoji (`✨ feat: …` or `:sparkles: feat: …`).
              # Older subjects without one still match.
              subject="$line"
              if [[ ! "$subject" =~ ^(feat|fix|docs|chore)!?: ]]; then
                if [[ "$subject" =~ ^[^[:space:]]+[[:space:]]+(.*)$ ]]; then
                  rest="${BASH_REMATCH[1]}"
                  if [[ "$rest" =~ ^(feat|fix|docs|chore)!?: ]]; then
                    subject="$rest"
                  fi
                fi
              fi
              case "$subject" in
                feat:* | feat!:*) feats+="* ${subject#*: }"$'\n' ;;
                fix:* | fix!:*) fixes+="* ${subject#*: }"$'\n' ;;
                docs:* | docs!:*) docs+="* ${subject#*: }"$'\n' ;;
                # The tag is the version; a bump commit on every release is noise.
                chore:\ bump\ to\ * | chore!:\ bump\ to\ *) continue ;;
                chore:* | chore!:*) chores+="* ${subject#*: }"$'\n' ;;
                *) other+="* ${line}"$'\n' ;;
              esac
            done < <(git log "${PREV}..HEAD" --pretty=tformat:'%s' --no-merges)

            append_section "Features" "$(printf '%s' "$feats" | collapse_dupes)"
            append_section "Bug Fixes" "$(printf '%s' "$fixes" | collapse_dupes)"
            append_section "Documentation" "$(printf '%s' "$docs" | collapse_dupes)"
            append_section "Internal Changes" "$(printf '%s' "$chores" | collapse_dupes)"
            append_section "Other Changes" "$(printf '%s' "$other" | collapse_dupes)"

            printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$REPO" "$PREV" "$TAG" >> "$NOTES"
          else
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for this version.\n\n' \
              "$REPO" "$TAG" >> "$NOTES"
            printf '**Full Changelog**: https://github.com/%s/commits/%s\n' \
              "$REPO" "$TAG" >> "$NOTES"
          fi

          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES"
