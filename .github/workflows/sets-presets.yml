# Daily Rebrickable catalog → src/data/sets-presets.json

name: Refresh sets presets

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build sets-presets.json
        run: python3 scripts/build-sets-presets.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          git add src/data/sets-presets.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh sets-presets.json"
          git push
          gh workflow run "Deploy Brickcard to GitHub Pages"
